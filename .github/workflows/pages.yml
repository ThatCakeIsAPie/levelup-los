# Builds the app and publishes it to GitHub Pages on every push to main.
# Live at https://thatcakeisapie.github.io/levelup-los/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /levelup-los/
          # The public demo runs on browser storage with the demo-user picker
          # and never contacts a database (see src/lib/config.ts).
          VITE_DATA_SOURCE: local
      # Pages has no SPA rewrites: serve the app for unknown paths so deep
      # links like /people/4 load on refresh.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
