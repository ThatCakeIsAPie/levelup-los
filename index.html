<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%BRAND_NAME%</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      // Keep in sync with src/lib/theme.ts (key "<prefix>.theme"; the placeholders
      // are filled from src/brand/brand.ts by the plugin in vite.config.ts).
      (function () {
        var pref = "auto";
        try {
          var v = localStorage.getItem("%BRAND_STORAGE_PREFIX%.theme");
          if (v === "light" || v === "dark" || v === "auto") pref = v;
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
